    <main>
        <section id="contact" class="main style1">
            <div class="container">
                <header class="major special">
                    <h2>お問い合わせ</h2>
                </header>
                <p>お問い合わせはこちらからお願いいたします。<br>
                    直接お電話でも構いません<span style="color: #e72e7e;font-weight: 600;">080-6182-6126</span>までご連絡下さい！<br>
                    メールフォームでのお問い合わせは、
                    下記に必要事項をご記入の上お問い合せ下さい。</p>

                <form name="contact" method="POST" data-netlify="true" action="/thanks.html" netlify>
                    <div class="row gtr-uniform gtr-50">
                        <div class="col-12 col-12-medium">
                            <label for="full_name">氏名</label>
                            <input type="text" name="demo-name" id="demo-name" value="" placeholder="氏名" required />
                        </div>
                        <div class="col-12 col-12-xsmall">
                            <label for="email_address">メールアドレス</label>
                            <input type="email" name="demo-email" id="demo-email" value="" placeholder="Email"
                                required />
                        </div>
                        <div class="col-12">
                            <label for="message_content">お問い合わせ内容</label>
                            <select name="demo-category" id="demo-category">
                                <option value="">- 選択してください -</option>
                                <option value="1">業務委託について</option>
                                <option value="1">案件依頼について</option>
                                <option value="1">その他</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label for="message_content">お問い合わせ詳細</label>
                            <textarea name="demo-message" id="demo-message" placeholder="" rows="6"></textarea>
                        </div>
                        <!-- Netlify bot 防止 -->
                        <input type="hidden" name="form-name" value="contact">
                        <div hidden>
                            <input name="bot-field">
                        </div>
                        <div class="col-12">
                            <ul class="actions">
                                <li><input type="submit" value="送信する" class="primary" /></li>
                            </ul>
                        </div>
                    </div>
                </form>
            </div>
        </section>
